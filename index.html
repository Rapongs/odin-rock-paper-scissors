<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="game-card">
      <h1>Rock Paper Scissors</h1>

      <div class="scoreboard">
        <div class="score-item">
          <h3>Player</h3>
          <p id="player-score">0</p>
        </div>
        <div class="score-item">
          <h3>Computer</h3>
          <p id="computer-score">0</p>
        </div>
      </div>

      <div class="arena">
        <div class="player-slot">
          <div class="emoji-box" id="player-choice">❓</div>
          <span>You</span>
        </div>

        <div class="vs-badge">VS</div>

        <div class="player-slot">
          <div class="emoji-box" id="computer-choice">❓</div>
          <span>Computer</span>
        </div>
      </div>

      <div class="status-msg" id="status-text">Choose one below to play!</div>

      <div class="controls">
        <button class="btn-choice" onclick="play('batu')" title="Batu">
          🪨
        </button>
        <button class="btn-choice" onclick="play('kertas')" title="Kertas">
          📄
        </button>
        <button class="btn-choice" onclick="play('gunting')" title="Gunting">
          ✂️
        </button>
      </div>

      <button class="btn-reset" onclick="resetGame()">Reset</button>
    </div>
  </body>
  <script src="script.js"></script>
</html>
